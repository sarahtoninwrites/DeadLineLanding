<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeadLine</title>
   <link rel="stylesheet" href="css/style.css">
  <style>

    .final-cta {
      opacity: 0;
      visibility: hidden;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .play-button-link {
      position: absolute;
      z-index:10;
      bottom: 15%;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .play-button-link:hover {
      transform: scale(1.1);
    }

    .top-right-btn {
      top: 1.8rem;
      right: 1.8rem;
      bottom: auto;
    }
    .top-right-btn img {
      height:3.125rem;
    }
    .final-btn {
      margin-top:10%;
    }

    @media (max-width: 768px) {
        .top-right-btn img {
            height:2rem;
        }
    }
 
  </style>
</head>
<body>
<img
    src="Assets/bg_elements/orangeLines.svg"
    class="corner-svg"
>
<img
    src="Assets/bg_elements/org-blur.png"
    class="org-blur"
>
<img
    src="Assets/bg_elements/purp-blur.png"
    class="purp-blur"
>
<img
    src="Assets/bg_elements/Main-Gradient.png"
    class="main-blur"
>

<section class="deadline-hero">
 <div class="hero-stage">

        <div class="hero-zoom-wrapper">

            <div class="hero-art-container">

                <img src="Assets/hero_elements/DeadLine.svg" class="hero-art">

                <img class="character char-chair-L" src="Assets/hero_elements/Char_Chair.svg">
                <img class="character char-front-L" src="Assets/hero_elements/Char_Front.svg">
                <img class="character char-side-L" src="Assets/hero_elements/Char_Side.svg">
                <img class="character char-front-R" src="Assets/hero_elements/Char_Front.svg">

                <img class="character walking-character"
                    src="Assets/hero_elements/char_walking/0000.png">

            </div>

            <p class="subtitle">
                A game about escaping the one thing you can never outrun.
            </p>

        </div>
        
        <div class="scroll-indicator">
        <img src="Assets/scroll.svg" alt="Scroll down">
        </div>
</div>
   
</section>

<div class= "fall-trigger"></div>

<section class="keyboard-scene section-two">

    <!-- <div id="three-keyboard-container">
        <div id="three-character-container"></div>
    </div>  -->

    <video
        class="keyboard-video"
        muted
        autoplay
        loop
        playsinline
    >
    </video>

    <div class="keyboard-overlay">

        <p class= "main-text">
            
        </p>
        <p class="sub-text">
        </p>
    </div>

    <a href="https://studiomesmer.com/deadline" class="play-button-link top-right-btn">
        <img src="Assets/PlayButton.svg" alt="Play Now">
    </a>

</section>


<section class="transition-section">
    <div class="transition-content">
        <p class="transition-subtext">You made it across. You're still alive!</p>
        <div class="transition-text">
            <div class="transition-row">
                <p>But</p>
                <video class="transition-video" autoplay muted playsinline loop>
                    <source src="Assets/esc_key.webm" type="video/webm">
                </video>
                <p>doesn't lead outside.</p>
            </div>
            <p>It leads deeper.</p>
        </div>
    </div>
    <div class="scroll-indicator transition-scroll" style="opacity: 0; visibility: hidden;">
        <img src="Assets/scroll.svg" alt="Scroll down">
    </div>
</section>


<section class="figma-loading">
  <div class="loading-images">
   <img
       src="Assets/Figma.png"
      class="Figma-logo"
    >
    <img
       src="Assets/figma_filename.png"
      class="Figma-filename"
    >
  </div>
    <div class="loading-bar-container">
        <div class="loading-bar-progress"></div>
    </div>

</section>

<div class="notification-overlay"></div>

<section class="figma-scene">
    <div class="game-world">
        <div class="platforms-container">
            <!-- Platforms styled like Figma rectangles -->
            <img class="game-platform" src="Assets/figma_scene/Search.png" style="width: 800px; left: 0; bottom: -250px;">

            <img class="game-platform" src="Assets/figma_scene/smallComment.png" style="width: 600px; left: 800px; bottom: 70px;">

            <img class="game-platform jump-pad" src="Assets/figma_scene/Jumppad/Jump Pad_00.png" style="width: 150px; left: 1500px; bottom: 100px;">

            <img class="game-platform" src="Assets/figma_scene/BigComment.png" style="width: 600px; left: 1850px; bottom: -150px;">

            <img class="game-platform" src="Assets/figma_scene/export.jpg" style="width: 300px; left: 2800px; bottom: 40px;">

        </div>
        <div class="game-character">
            <!-- <img id="character-sprite" /> -->
        </div>
    </div>
    <div class="exporting-images">
        <img
            src="Assets/figma_scene/export_text.png"
            class="export-text"
          >
          <div class="loading-bar-container">
              <div class="loading-bar-progress"></div>
          </div>
          <img
            src="Assets/figma_scene/export_text_2.png"
            class="export-filename"
          >
    </div>
    <div class="figma-overlay">

        <p class= "main-text">
            
        </p>
        <p class="sub-text">
        </p>
    </div>

    <a href="https://studiomesmer.com/deadline" class="play-button-link top-right-btn">
        <img src="Assets/PlayButton.svg" alt="Play Now">
    </a>
</section>


<section class="final-section">
    <p class="final-text">
        He made it. Can you?
    </p>
    <div class="final-cta">
        <div class="hero-art-container final-art">
            <img
                src="Assets/hero_elements/DeadLine.svg"
                class="hero-art"
            >
            <img class="character char-chair-L" src="Assets/hero_elements/Char_Chair.svg">
            <img class="character char-front-L" src="Assets/hero_elements/Char_Front.svg">
            <img class="character char-side-L" src="Assets/hero_elements/Char_Side.svg">
            <img class="character char-front-R" src="Assets/hero_elements/Char_Front.svg">
            <img class="character char-chair-R" src="Assets/hero_elements/Char_Chair.svg">

        </div>
        <a href="https://studiomesmer.com/deadline" class="play-button-link final-btn">
            <img src="Assets/PlayButton.svg" alt="Play Now">
        </a>

    </div>
</section>


    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>


    <!-- LENIS -->
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.16/dist/lenis.min.js"></script>


    <!-- THREE -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>


    <!-- GLTF LOADER -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- FBX LOADER -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FBXLoader.js"></script>

    <!-- ORBIT CONTROLS -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>

    <script src="js/main.js"></script>

    <script src="js/hero-character.js"></script>

    <script src="js/hero-zoom.js"></script>

    <script src="js/KB-narrative.js"></script>

    <script src="js/figma-scene.js"></script>

    <script src="js/KB-background.js"></script>
    <script src="js/final-cta.js"></script>
    <script src="js/transition-section.js"></script>
    <!-- <script src="js/KB-background.js"></script> -->


</body>
</html>
